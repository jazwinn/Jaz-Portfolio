name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing writes the built site to the gh-pages branch, which is the
# source GitHub Pages serves this repository from.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Portfolio-Site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: Portfolio-Site

      - name: Lint
        run: npm run lint
        working-directory: Portfolio-Site

      - name: Build
        run: npm run build
        working-directory: Portfolio-Site

      - name: Publish to gh-pages
        working-directory: Portfolio-Site/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
